name: Align Management Review Equipment Performance

on:
  push:
    branches:
      - feat/management-review-equipment-performance-20260908

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/management-review-equipment-performance-20260908
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/patch_management_review_equipment_period.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify TypeScript and diff
        run: |
          npx tsc --noEmit
          git diff --check
      - name: Commit aligned changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/management-review/page.tsx app/management-review/components/ManagementReviewSnapshotReport.tsx
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Align equipment metrics to Management Review period end"
          git push origin HEAD:feat/management-review-equipment-performance-20260908
