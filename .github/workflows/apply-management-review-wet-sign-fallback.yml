name: Apply Management Review Wet Signature Fallback

on:
  push:
    branches:
      - fix/management-review-wet-signature-fallback-20260908

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fallback
        run: python scripts/apply_management_review_wet_sign_fallback.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript verification
        run: npx tsc --noEmit
      - name: Verify fallback behavior
        run: |
          grep -q 'hasWetSignatureConfiguration(review)' app/management-review/page.tsx
          grep -q 'resolvePrintSigning(data)' app/management-review/print/page.tsx
          grep -q 'snapshot={reportSnapshot}' app/management-review/print/page.tsx
          grep -q 'Open Wet Signature Report' app/management-review/page.tsx
      - name: Commit fallback fix
        run: |
          git config user.name "QualiSphere Workflow Hardening"
          git config user.email "actions@users.noreply.github.com"
          git add app/management-review/page.tsx app/management-review/print/page.tsx
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "Fix Management Review wet signature configuration fallback [mr-wet-fallback]"
            git push
          fi
