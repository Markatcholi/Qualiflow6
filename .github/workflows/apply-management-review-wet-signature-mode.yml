name: Apply Management Review Wet Signature Mode

on:
  push:
    branches:
      - fix/management-review-wet-signature-report-20260908

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[mr-wet-mode]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/management-review-wet-signature-report-20260908
          fetch-depth: 0

      - name: Apply wet-signature report mode
        run: python3 scripts/apply_management_review_wet_signature_mode.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript verification
        run: npx tsc --noEmit

      - name: Verify wet-signature isolation
        run: |
          grep -q 'reportMode' app/management-review/print/page.tsx
          grep -q 'requestedMode === "wet"' app/management-review/print/page.tsx
          grep -q 'showPrintSignatureBlocks={wetSignatureMode}' app/management-review/print/page.tsx
          grep -q '!wetSignatureMode' app/management-review/print/page.tsx
          grep -q 'Wet signatures do not close or lock' app/management-review/print/page.tsx
          grep -q 'Open Electronic Report' app/management-review/page.tsx
          grep -q 'Open Wet Signature Report' app/management-review/page.tsx
          grep -q '&mode=wet' app/management-review/page.tsx

      - name: Commit wet-signature mode
        run: |
          git config user.name 'QualiSphere Workflow Hardening'
          git config user.email 'actions@users.noreply.github.com'
          git add app/management-review/page.tsx app/management-review/print/page.tsx
          git commit -m 'Separate Management Review wet signature report mode [mr-wet-mode]'
          git push origin HEAD:fix/management-review-wet-signature-report-20260908
