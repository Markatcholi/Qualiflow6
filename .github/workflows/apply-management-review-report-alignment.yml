name: Apply Management Review Report Alignment

on:
  push:
    branches:
      - fix/management-review-report-alignment-20260908

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[mr-report-aligned]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/management-review-report-alignment-20260908
          fetch-depth: 0

      - name: Apply Management Review report alignment
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ------------------------------------------------------------
          # Owner / report-builder page: selected period is authoritative.
          # ------------------------------------------------------------
          p = Path('app/management-review/page.tsx')
          s = p.read_text()

          state_marker = '  const [executiveSummaryText, setExecutiveSummaryText] = useState("");\n'
          if 'reportDataPeriodKey' not in s:
              if state_marker not in s:
                  raise SystemExit('Executive summary state marker not found')
              s = s.replace(
                  state_marker,
                  state_marker + '  const [reportDataPeriodKey, setReportDataPeriodKey] = useState("");\n',
                  1,
              )

          trend_start = s.find('  const getLast6Months = () => {')
          trend_end = s.find('  const daysBetween = (dateString: string) => {', trend_start)
          if trend_start == -1 or trend_end == -1:
              raise SystemExit('Trend helper block not found')

          new_trend_helpers = '''  const getReviewPeriodKey = () => `${reviewPeriodStart || ""}|${reviewPeriodEnd || ""}`;

  const reviewAsOfDate = () => {
    if (reviewPeriodEnd) {
      return new Date(`${reviewPeriodEnd}T23:59:59.999`);
    }
    return new Date();
  };

  const filterByReviewPeriod = (items: any[], dateFields: string[] = ["created_at"]) => {
    if (!reviewPeriodStart || !reviewPeriodEnd) return items;

    const start = new Date(`${reviewPeriodStart}T00:00:00.000`).getTime();
    const end = new Date(`${reviewPeriodEnd}T23:59:59.999`).getTime();

    return items.filter((item: any) => {
      const rawDate = dateFields
        .map((field) => item?.[field])
        .find((value) => value !== null && value !== undefined && String(value).trim() !== "");

      if (!rawDate) return false;
      const timestamp = new Date(rawDate).getTime();
      return Number.isFinite(timestamp) && timestamp >= start && timestamp <= end;
    });
  };

  const getTrendMonths = () => {
    const months: { key: string; label: string }[] = [];

    if (reviewPeriodStart && reviewPeriodEnd) {
      const start = new Date(`${reviewPeriodStart}T00:00:00`);
      const end = new Date(`${reviewPeriodEnd}T23:59:59`);
      let cursor = new Date(start.getFullYear(), start.getMonth(), 1);
      const last = new Date(end.getFullYear(), end.getMonth(), 1);

      while (cursor <= last) {
        const year = cursor.getFullYear();
        const month = String(cursor.getMonth() + 1).padStart(2, "0");
        months.push({
          key: `${year}-${month}`,
          label: cursor.toLocaleString("en-US", { month: "short", year: "2-digit" }),
        });
        cursor = new Date(year, cursor.getMonth() + 1, 1);
      }

      return months;
    }

    const now = new Date();
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, "0");
      months.push({
        key: `${year}-${month}`,
        label: d.toLocaleString("en-US", { month: "short", year: "2-digit" }),
      });
    }

    return months;
  };

  const buildTrend = (items: any[]) => {
    const months = getTrendMonths();
    const counts: Record<string, number> = {};

    months.forEach((m) => {
      counts[m.key] = 0;
    });

    items.forEach((item) => {
      const rawDate = item.created_at || item.date_detected || item.audit_date || item.assigned_at;
      if (!rawDate) return;

      const d = new Date(rawDate);
      const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;

      if (counts[key] !== undefined) {
        counts[key] += 1;
      }
    });

    return months.map((m) => ({ label: m.label, count: counts[m.key] }));
  };

'''
          s = s[:trend_start] + new_trend_helpers + s[trend_end:]

          old_days = '''  const daysBetween = (dateString: string) => {
    const start = new Date(dateString).getTime();
    const now = new Date().getTime();
    return Math.floor((now - start) / (1000 * 60 * 60 * 24));
  };'''
          new_days = '''  const daysBetween = (dateString: string) => {
    const start = new Date(dateString).getTime();
    const asOf = reviewAsOfDate().getTime();
    return Math.floor((asOf - start) / (1000 * 60 * 60 * 24));
  };'''
          if old_days not in s:
              raise SystemExit('daysBetween block not found')
          s = s.replace(old_days, new_days, 1)

          replacements = {
              'const allNcmrs = ncmrAllData || [];': 'const allNcmrs = filterByReviewPeriod(ncmrAllData || [], ["date_detected", "created_at"]);',
              'const allCapas = capaAllData || [];': 'const allCapas = filterByReviewPeriod(capaAllData || [], ["created_at", "initiated_at"]);',
              'const allScars = scarData || [];': 'const allScars = filterByReviewPeriod(scarData || [], ["created_at", "initiated_at"]);',
              'const allOos = oosData || [];': 'const allOos = filterByReviewPeriod(oosData || [], ["created_at", "investigation_date"]);',
              'const allComplaints = complaintData || [];': 'const allComplaints = filterByReviewPeriod(complaintData || [], ["created_at", "date_received"]);',
              'const allDocuments = documentData || [];': 'const allDocuments = filterByReviewPeriod(documentData || [], ["created_at", "effective_date"]);',
              'const allTraining = trainingData || [];': 'const allTraining = filterByReviewPeriod(trainingData || [], ["assigned_at", "created_at"]);',
              'const allAudits = auditData || [];': 'const allAudits = filterByReviewPeriod(auditData || [], ["audit_date", "created_at"]);',
              'const allFindings = findingData || [];': 'const allFindings = filterByReviewPeriod(findingData || [], ["created_at"]);',
              'calculateChangeControlKpis(changeData || [])': 'calculateChangeControlKpis(filterByReviewPeriod(changeData || [], ["created_at", "requested_date"]))',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected dataset marker not found: {old}')
              s = s.replace(old, new, 1)

          s = s.replace(
              '    const today = new Date();\n    const todayStr = today.toISOString().split("T")[0];',
              '    const today = reviewAsOfDate();\n    const todayStr = today.toISOString().split("T")[0];',
          )
          s = s.replace('    const next7 = new Date();', '    const next7 = new Date(today);', 1)
          s = s.replace(
              'const todayStrForDocuments = new Date().toISOString().slice(0, 10);',
              'const todayStrForDocuments = reviewAsOfDate().toISOString().slice(0, 10);',
              1,
          )
          s = s.replace(
              'const todayStrForTraining = new Date().toISOString().slice(0, 10);',
              'const todayStrForTraining = reviewAsOfDate().toISOString().slice(0, 10);',
              1,
          )

          fetch_end_marker = '    buildNotifications(allNcmrs, allCapas, allScars, allOos, allAudits, allFindings);\n  };'
          if fetch_end_marker not in s:
              raise SystemExit('fetchData completion marker not found')
          s = s.replace(
              fetch_end_marker,
              '    buildNotifications(allNcmrs, allCapas, allScars, allOos, allAudits, allFindings);\n    setReportDataPeriodKey(getReviewPeriodKey());\n  };',
              1,
          )

          initial_effect_marker = '''  }, []);

  const ncmrClosureRate ='''
          if initial_effect_marker not in s:
              raise SystemExit('Initial effect marker not found')
          s = s.replace(
              initial_effect_marker,
              '''  }, []);

  useEffect(() => {
    if (reviewPeriodStart && reviewPeriodEnd) {
      fetchData();
    }
  }, [reviewPeriodStart, reviewPeriodEnd]);

  const ncmrClosureRate =''',
              1,
          )

          create_marker = '''    if (!reviewTitle.trim()) {
      alert("Review title is required.");
      return;
    }
'''
          if create_marker not in s:
              raise SystemExit('Create review validation marker not found')
          s = s.replace(
              create_marker,
              create_marker + '''
    if (!reviewPeriodStart || !reviewPeriodEnd) {
      alert("Review period start and end dates are required before generating the Management Review report.");
      return;
    }

    if (new Date(reviewPeriodStart).getTime() > new Date(reviewPeriodEnd).getTime()) {
      alert("Review period start date cannot be after the end date.");
      return;
    }

    if (reportDataPeriodKey !== getReviewPeriodKey()) {
      alert("Management Review data is still refreshing for the selected report period. Please wait a moment and generate the report again.");
      return;
    }
''',
              1,
          )

          snapshot_marker = '''    return {
      generated_at: new Date().toISOString(),
      report_config: reportConfig,'''
          if snapshot_marker not in s:
              raise SystemExit('Snapshot marker not found')
          s = s.replace(
              snapshot_marker,
              '''    return {
      generated_at: new Date().toISOString(),
      review_period_start: reviewPeriodStart || null,
      review_period_end: reviewPeriodEnd || null,
      as_of_date: reviewPeriodEnd || reviewDate || null,
      report_config: reportConfig,''',
              1,
          )

          p.write_text(s)

          # ------------------------------------------------------------
          # Approval page: use the same curated report renderer.
          # ------------------------------------------------------------
          p = Path('app/management-review/[id]/approval-review/page.tsx')
          s = p.read_text()

          import_marker = 'import { supabase } from "../../../../lib/supabaseClient";\n'
          shared_import = 'import ManagementReviewSnapshotReport from "../../components/ManagementReviewSnapshotReport";\n'
          if shared_import not in s:
              if import_marker not in s:
                  raise SystemExit('Approval page import marker not found')
              s = s.replace(import_marker, import_marker + shared_import, 1)

          report_start = s.find('      {config.executiveSummary !== false ? (')
          assignment_marker = '      <section style={cardStyle}>\n        <h2 style={sectionTitleStyle}>Your Approval Assignment</h2>'
          report_end = s.find(assignment_marker, report_start)
          if report_start == -1 or report_end == -1:
              raise SystemExit('Approval report rendering block not found')

          replacement = '''      <ManagementReviewSnapshotReport
        snapshot={snapshot}
        config={config}
        executiveSummary={review?.executive_summary}
      />

'''
          s = s[:report_start] + replacement + s[report_end:]
          p.write_text(s)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript verification
        run: npx tsc --noEmit

      - name: Verify Management Review alignment rules
        run: |
          grep -q 'filterByReviewPeriod(ncmrAllData' app/management-review/page.tsx
          grep -q 'review_period_start: reviewPeriodStart' app/management-review/page.tsx
          grep -q 'ManagementReviewSnapshotReport' app/management-review/[id]/approval-review/page.tsx
          grep -q 'report_snapshot_json' app/management-review/print/page.tsx
          grep -q 'ManagementReviewSnapshotReport' app/management-review/print/page.tsx
          if grep -q 'supabase.from("ncmrs")' app/management-review/print/page.tsx; then
            echo 'Printable report still recalculates live NCMR data'
            exit 1
          fi
          if grep -q 'Sign as VP Quality' app/management-review/print/page.tsx; then
            echo 'Legacy hardcoded printable signature controls remain'
            exit 1
          fi

      - name: Commit aligned report implementation
        run: |
          git config user.name 'QualiSphere Workflow Hardening'
          git config user.email 'actions@users.noreply.github.com'
          git add app/management-review/page.tsx app/management-review/[id]/approval-review/page.tsx
          git commit -m 'Align Management Review period and report rendering [mr-report-aligned]'
          git push origin HEAD:fix/management-review-report-alignment-20260908
