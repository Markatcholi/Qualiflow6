name: Apply Management Review Report Alignment

on:
  push:
    branches:
      - fix/management-review-report-alignment-20260908

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[mr-report-aligned]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/management-review-report-alignment-20260908
          fetch-depth: 0

      - name: Apply Management Review report alignment
        run: python3 scripts/apply_management_review_report_alignment.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript verification
        run: npx tsc --noEmit

      - name: Verify Management Review alignment rules
        run: |
          grep -q 'filterByReviewPeriod(ncmrAllData' app/management-review/page.tsx
          grep -q 'review_period_start: reviewPeriodStart' app/management-review/page.tsx
          grep -q 'ManagementReviewSnapshotReport' app/management-review/[id]/approval-review/page.tsx
          grep -q 'report_snapshot_json' app/management-review/print/page.tsx
          grep -q 'ManagementReviewSnapshotReport' app/management-review/print/page.tsx
          if grep -q 'supabase.from("ncmrs")' app/management-review/print/page.tsx; then
            echo 'Printable report still recalculates live NCMR data'
            exit 1
          fi
          if grep -q 'Sign as VP Quality' app/management-review/print/page.tsx; then
            echo 'Legacy hardcoded printable signature controls remain'
            exit 1
          fi

      - name: Commit aligned report implementation
        run: |
          git config user.name 'QualiSphere Workflow Hardening'
          git config user.email 'actions@users.noreply.github.com'
          git add app/management-review/page.tsx app/management-review/[id]/approval-review/page.tsx
          git commit -m 'Align Management Review period and report rendering [mr-report-aligned]'
          git push origin HEAD:fix/management-review-report-alignment-20260908
