name: Inspect Management Review Report

on:
  push:
    branches:
      - fix/management-review-report-approval-package-20260907

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/management-review-report-approval-package-20260907
      - name: Inspect report and approval code
        shell: bash
        run: |
          echo '=== REPORT SNAPSHOT / GENERATION MATCHES ==='
          grep -n -E 'buildReportSnapshot|report_snapshot|report_snapshot_json|generated_report|reportConfig|Generate Report|generate.*Report|management_reviews.*insert|management_reviews.*update|snapshot' app/management-review/page.tsx | head -n 220 || true
          echo '=== APPROVER MATCHES ==='
          grep -n -E 'addApprover|submit.*Approval|Submit for Approval|approval_tasks|management_review_approvers' app/management-review/page.tsx | head -n 220 || true
