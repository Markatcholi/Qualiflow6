name: Apply Management Review Print Signer Persistence

on:
  push:
    branches:
      - fix/management-review-report-alignment-20260908

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[mr-print-persist]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/management-review-report-alignment-20260908
          fetch-depth: 0

      - name: Apply Print & Sign persistence
        run: python3 scripts/persist_management_review_print_signers.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript verification
        run: npx tsc --noEmit

      - name: Verify Print & Sign persistence
        run: |
          grep -q 'persistPrintSigningDraft' app/management-review/page.tsx
          grep -q 'report_config_json: {' app/management-review/page.tsx
          grep -q 'draftPrintSigning' app/management-review/page.tsx
          grep -q 'snapshotPrintSigning' app/management-review/page.tsx
          grep -q 'void persistPrintSigningDraft(enabled, printSigners);' app/management-review/page.tsx
          grep -q 'void persistPrintSigningDraft(true, nextSigners);' app/management-review/page.tsx
          grep -q 'void persistPrintSigningDraft(printAndSignEnabled, nextSigners);' app/management-review/page.tsx

      - name: Commit Print & Sign persistence
        run: |
          git config user.name 'QualiSphere Workflow Hardening'
          git config user.email 'actions@users.noreply.github.com'
          git add app/management-review/page.tsx
          git commit -m 'Persist Management Review print signer draft configuration [mr-print-persist]'
          git push origin HEAD:fix/management-review-report-alignment-20260908
